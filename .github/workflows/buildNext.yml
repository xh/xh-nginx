name: Build Next

# Publishes the `next` and `next-brotli` xhio/xh-nginx snapshot tags. Rebuilt
# on every push to develop and weekly so they pick up upstream base image
# patches. See README / CHANGELOG for the currently supported variants.

on:
  push:
    branches: [develop]
  schedule:
    # 01:00 UTC Thursday ≈ Wed 20:00 EST / 21:00 EDT.
    # Approximates the prior TeamCity "Wednesday 20:00 America/New_York" trigger
    # (GitHub Actions cron is UTC-only with no DST awareness).
    - cron: '0 1 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: buildNext-${{ matrix.variant.tag-suffix }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Supported variants: the default nginx image and the fholzer/nginx-brotli
      # variant, each a build target in the Dockerfile. Both use the floating
      # major.minor of the Dockerfile's pinned NGINX_VERSION, so they pick up
      # upstream patches automatically.
      matrix:
        variant:
          - { target: standard, tag-suffix: "" }
          - { target: brotli, tag-suffix: "-brotli" }
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          TARGET: ${{ matrix.variant.target }}
          TAG_SUFFIX: ${{ matrix.variant.tag-suffix }}
        run: |
          # Float on the major.minor of the pinned version, e.g. 1.31.9 -> 1.31.
          NGINX_MINOR=$(sed -nE 's/^ARG NGINX_VERSION=([0-9]+\.[0-9]+)\..*/\1/p' Dockerfile)
          if [ -z "$NGINX_MINOR" ]; then
            echo "::error::Could not read NGINX_VERSION from Dockerfile"
            exit 1
          fi
          TAG="xhio/xh-nginx:next${TAG_SUFFIX}"
          docker build --pull \
            --build-arg NGINX_VERSION="$NGINX_MINOR" \
            --target "$TARGET" \
            -t "$TAG" .
          docker run --rm --entrypoint nginx "$TAG" -v
          docker push "$TAG"
