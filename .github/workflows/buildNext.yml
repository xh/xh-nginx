name: Build Next

# Publishes the `next` and `next-brotli` xhio/xh-nginx snapshot tags. Rebuilt
# on every push to develop and weekly so they pick up upstream base image
# patches. See README / CHANGELOG for the currently supported variants.

on:
  push:
    branches: [develop]
  schedule:
    # 01:00 UTC Thursday ≈ Wed 20:00 EST / 21:00 EDT.
    # Approximates the prior TeamCity "Wednesday 20:00 America/New_York" trigger
    # (GitHub Actions cron is UTC-only with no DST awareness).
    - cron: '0 1 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: buildNext-${{ matrix.variant.tag-suffix }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Supported variants: the default nginx image and the fholzer/nginx-brotli
      # variant, each a build target in the Dockerfile. Both use the floating
      # major.minor of the Dockerfile's pinned NGINX_VERSION, so they pick up
      # upstream patches automatically.
      matrix:
        variant:
          - { target: standard, tag-suffix: "" }
          - { target: brotli, tag-suffix: "-brotli" }
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A buildx builder (docker-container driver) is required to attach attestations.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        env:
          TARGET: ${{ matrix.variant.target }}
          TAG_SUFFIX: ${{ matrix.variant.tag-suffix }}
        run: |
          # Float on the major.minor of the pinned version, e.g. 1.31.9 -> 1.31.
          NGINX_MINOR=$(sed -nE 's/^ARG NGINX_VERSION=([0-9]+\.[0-9]+)\..*/\1/p' Dockerfile)
          if [ -z "$NGINX_MINOR" ]; then
            echo "::error::Could not read NGINX_VERSION from Dockerfile"
            exit 1
          fi
          # Build, smoke test, push with attestations, and tag only once the pushed image is
          # confirmed to be the tested one. See the script for details.
          NGINX_VERSION="$NGINX_MINOR" .github/scripts/build-image.sh "$TARGET" "xhio/xh-nginx:next${TAG_SUFFIX}"

  # Posts to Slack when this workflow fails, so a broken run is noticed. Needs no checkout, so
  # it still works when the failure is early.
  alert:
    needs: [build]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Alert Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ":rotating_light: xh-nginx: ${{ github.workflow }} failed"
          BODY: "The `${{ github.workflow }}` workflow failed. Trigger: `${{ github.event_name }}` on `${{ github.ref_name }}`. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run log>."
          FOOTER: "Posted on every failed run of this workflow."
        run: |
          jq -n --arg title "$TITLE" --arg body "$BODY" --arg footer "$FOOTER" '{text: $title, blocks: [
              {type: "header", text: {type: "plain_text", text: $title, emoji: true}},
              {type: "section", text: {type: "mrkdwn", text: $body}},
              {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
            ]}' | curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
