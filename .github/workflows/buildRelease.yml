name: Build Release

# Publishes a numbered xhio/xh-nginx release. Manually triggered from master
# (or a hotfix branch). Validates the release version, builds the release
# variants in parallel against the pinned nginx patch version (the
# NGINX_VERSION default in the Dockerfile), pushes to Docker Hub with both the
# immutable `<xh-release><suffix>` tag and the floating `latest<suffix>` tag,
# then tags the commit and creates a GitHub release. A hotfix gets only the
# immutable tag, so `latest` stays on the newest release.
# See README / CHANGELOG for the currently supported variants.
#
# To release with a newer nginx patch: bump NGINX_VERSION in the Dockerfile,
# update CHANGELOG.md in a normal PR, merge to master, then dispatch this
# workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 3.0.0)'
        required: true
        type: string
      is-hotfix:
        description: 'As hotfix. Check when releasing a hotfix to a version other than the latest. Does not move the latest tags.'
        required: true
        default: false
        type: boolean

# Run release builds one-by-one, but never cancel a release in flight.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  validate:
    # Guards against accidental release from develop. Requires master for standard
    # releases and a branch other than master (or develop) when is-hotfix is set.
    if: github.ref != 'refs/heads/develop' && ((github.ref == 'refs/heads/master') != inputs.is-hotfix)

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout is required to be called with `fetch-depth: 0` and `fetch-tags: true`.
      - name: Validate release version
        uses: xh/hoist-dev-utils/.github/actions/validate-release-version@master
        with:
          version: ${{ inputs.version }}
          is-hotfix: ${{ inputs.is-hotfix }}

  build:
    needs: validate

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Supported release variants: the default nginx image and the
      # fholzer/nginx-brotli image, each a build target in the Dockerfile.
      # Both build the Dockerfile's pinned NGINX_VERSION and publish
      # `<version><suffix>` + `latest<suffix>`.
      matrix:
        variant:
          - { target: standard, tag-suffix: "" }
          - { target: brotli, tag-suffix: "-brotli" }

    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A buildx builder (docker-container driver) is required to attach attestations.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        env:
          TARGET: ${{ matrix.variant.target }}
          VERSION_TAG: xhio/xh-nginx:${{ inputs.version }}${{ matrix.variant.tag-suffix }}
          LATEST_TAG: xhio/xh-nginx:latest${{ matrix.variant.tag-suffix }}
          IS_HOTFIX: ${{ inputs.is-hotfix }}
        run: |
          # A hotfix patches an older release, so it must not move the latest tags.
          TAGS=("$VERSION_TAG")
          [ "$IS_HOTFIX" = true ] || TAGS+=("$LATEST_TAG")
          # Build, smoke test, push with attestations, and tag only once the pushed image is
          # confirmed to be the tested one. See the script for details. Builds the Dockerfile's
          # pinned NGINX_VERSION.
          .github/scripts/build-image.sh "$TARGET" "${TAGS[@]}"

  release:
    needs: build

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout is required to be called with `fetch-depth: 0` and `fetch-tags: true`.
      - name: Create tag and GitHub release
        uses: xh/hoist-dev-utils/.github/actions/create-tag-and-github-release@master
        with:
          version: ${{ inputs.version }}
          is-hotfix: ${{ inputs.is-hotfix }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Posts to Slack when this workflow fails, so a broken run is noticed. Needs no checkout, so
  # it still works when the failure is early.
  alert:
    needs: [validate, build, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Alert Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ":rotating_light: xh-nginx: ${{ github.workflow }} failed"
          BODY: "The `${{ github.workflow }}` workflow failed. Trigger: `${{ github.event_name }}` on `${{ github.ref_name }}`. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run log>."
          FOOTER: "Posted on every failed run of this workflow."
        run: |
          jq -n --arg title "$TITLE" --arg body "$BODY" --arg footer "$FOOTER" '{text: $title, blocks: [
              {type: "header", text: {type: "plain_text", text: $title, emoji: true}},
              {type: "section", text: {type: "mrkdwn", text: $body}},
              {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
            ]}' | curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

  # Announces each release in Slack, as a record that releases are happening.
  announce:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Announce in Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ":rocket: xh-nginx ${{ inputs.version }} released"
          VERSION: ${{ inputs.version }}
          IS_HOTFIX: ${{ inputs.is-hotfix }}
          NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}
          FOOTER: "Posted by the Build Release workflow."
        run: |
          if [ "$IS_HOTFIX" = true ]; then
            TAGS="\`$VERSION\` and \`$VERSION-brotli\`. A hotfix, so \`latest\` and \`latest-brotli\` are unchanged"
          else
            TAGS="\`$VERSION\`, \`$VERSION-brotli\`, \`latest\` and \`latest-brotli\`"
          fi
          BODY="Published to Docker Hub as $TAGS. <$NOTES_URL|Release notes>."
          jq -n --arg title "$TITLE" --arg body "$BODY" --arg footer "$FOOTER" '{text: $title, blocks: [
              {type: "header", text: {type: "plain_text", text: $title, emoji: true}},
              {type: "section", text: {type: "mrkdwn", text: $body}},
              {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
            ]}' | curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
