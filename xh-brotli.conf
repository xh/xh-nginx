# Standardized XH-specific nginx settings. This config partial is copied into $XH_NGINX_CONFIG_PATH
# within this project's Dockerfile. From there it is included within the top-level `http` block,
# typically alongside an `app.conf` config file provided by the app (with app-specific location
# blocks and other settings).

# Support compression for both static assets and proxy calls. Brotli is preferred by any client that
# advertises it, with gzip remaining as the fallback for those that do not - so both must be
# configured, with matching type lists.
# NOTE - `brotli on`/`gzip on` and their `_static` variants are set at the http level in this
# variant's nginx.conf (see nginx-brotli.conf) - the tuning + type lists live here so that the two
# compressors stay in sync. Keep these lists in sync with the gzip_types list in xh.conf. Note also
# that `text/html` is always compressed by nginx and cannot be included in these lists.
brotli_types application/json application/javascript application/x-ndjson text/css text/javascript text/plain;
gzip_comp_level 4;
gzip_min_length 1000;
gzip_proxied any;
# Emit `Vary: Accept-Encoding` so that shared caches (CDNs, corporate proxies) key their entries on
# the client's advertised encodings, and never hand a br/gzip response to a client that cannot decode
# it. NOTE - this single directive covers *both* compressors: ngx_brotli ships no `brotli_vary` of
# its own and honors this one for its dynamic and `brotli_static` responses alike.
gzip_vary on;
gzip_types application/json application/javascript application/x-ndjson text/css text/javascript text/plain;

# Increase client max body size to allow for larger uploads
client_max_body_size 100m;

# Increase proxy headers hash size due to our use of proxy_set_header - as per nginx msg in log.
proxy_headers_hash_max_size 1024;

# nginx's stock mime.types has no entry for `.map`, so JS source maps would otherwise fall through
# to `default_type` and be served as `application/octet-stream`. Note `types` blocks at the same
# level are additive - this extends the included mime.types table rather than replacing it. Serving
# maps as `application/json` also brings them under the gzip/brotli type lists above, which matters
# as maps are typically far larger than the bundles they describe.
types {
    application/json map;
}

# Convenience maps building the $expires var used by app-level `expires` directives (see the example
# server block at the bottom of this file). Two stages: the base bucket below, keyed on response
# content type, then a URI-level override for source maps (further below). App confs should
# reference only $expires - $xh_expires_by_type is an internal intermediate.
map $sent_http_content_type $xh_expires_by_type {
    default                 off;
    application/javascript  max;
    font/woff2              max;
    image/png               max;
    text/css                max;
    text/html               epoch;
}

# Source maps are content-hashed alongside the bundle they describe and are immutable, so they
# should be cached indefinitely. They are served as `application/json` (see `types` above), which
# cannot simply be given a `max` bucket by content type - Hoist apps also emit *unhashed* PWA
# manifests as `application/json`, and those must stay revalidated. So key off the URI instead.
#
# The `$upstream_addr` prefix confines this to responses served from disk: it is empty for a static
# file (leaving a string starting with `/`, as `$uri` always does) and holds the upstream address
# for anything proxied. A proxied API path that happens to end in `.map` therefore falls through to
# the by-content-type bucket above and is never pinned by this rule.
map $upstream_addr$uri $expires {
    default      $xh_expires_by_type;
    ~^/.+\.map$  max;
}

# Determine the device type via UA sniffing for setting the $is_desktop, $is_mobile, and $is_tablet
# Snagged from https://gist.github.com/perusio/1326701#gistcomment-2009231 and is not guaranteed
# by any means to be perfect or exhaustive. Apps should use with care - we can tune if we have
# real-world cases where we find this is not working as desired.
map $http_user_agent $ua_device {
	default 'desktop';
	~*(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge\ |maemo|midp|mmp|mobile.+firefox|netfront|opera\ m(ob|in)i|palm(\ os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows\ ce|xda|xiino/i 'mobile';
	~*android|ipad|playbook|silk/i 'tablet';
}

map $ua_device $is_mobile {
    default 0;
    mobile 1;
}

map $ua_device $is_tablet {
    default 0;
    tablet 1;
}

map $ua_device $is_desktop {
    default 0;
    desktop 1;
}

# Set new $xh_jespa_connection_id for use in xh-proxy include, where the resulting value is
# used to add/replace a Jespa-Connection-Id header. If request arrives with a Jespa-Connection-Id
# header already set, this map will re-use that same value: the incoming header is assumed to
# have been set by an upstream proxy or k8s ingress and to contain the actual client addr and port.
# Otherwise, we create the ID with the addr and port we know about here.
map $http_jespa_connection_id $xh_jespa_connection_id {
    volatile;
    default $http_jespa_connection_id;

    ""      $remote_addr:$remote_port;
}

# Ensure UTF8 charset spec'd in header, including for CSS files (which would not get a charset
# header by default). See https://github.com/xh/xh-nginx/issues/9 - rendering issue with icons.
# As with the gzip/brotli type lists above, `text/html` is always included by nginx and must not
# be listed here.
charset utf-8;
charset_types text/css text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml;

