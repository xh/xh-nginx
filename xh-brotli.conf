

#-----------------------------------------------------------------------------------------------
# Brotli variant additions, from xh-brotli.conf
#-----------------------------------------------------------------------------------------------
# The brotli image appends this file to the shared xh.conf above and installs the result as its
# $XH_NGINX_CONFIG_PATH/xh.conf. Apps that include xh.conf get both compressors from one file.
#
# `brotli on` and `brotli_static on` are set at the http level in nginx-brotli.conf. Clients that
# advertise brotli get it, and gzip (configured in xh.conf above) is the fallback for the rest.
# `gzip_vary on` above also covers brotli responses. ngx_brotli has no `brotli_vary` of its own.
# NOTE - keep this type list in sync with the gzip_types list in xh.conf. As with gzip, `text/html`
# is always compressed and cannot be included in this list.
brotli_types application/json application/javascript application/x-ndjson text/css text/javascript text/plain;
