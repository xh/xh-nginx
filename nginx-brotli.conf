# Copy of nginx.conf shipped with fholzer/nginx-brotli
# See https://github.com/fholzer/docker-nginx-brotli/blob/master/nginx.conf for original
user  nginx;
# XH customization - set worker_processes to auto (vs 1)
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    brotli on;
    brotli_static on;
    # XH customization - `gzip on`, `gzip_static on`, the gzip tuning, and both type lists are *not* set here, but
    # rather in xh.conf (the shared xh.conf with xh-brotli.conf appended), which is pulled in by the conf.d include
    # below. Setting `gzip on` here as well would fail nginx startup with a duplicate directive error.

    include /etc/nginx/conf.d/*.conf;
}
